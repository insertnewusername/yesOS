<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>

  <body>
    <div id="welcome">
        <div id="welcomeheader">
            <h1>Welcome</h1>
            <div style="cursor: pointer" id="welcomeclose"> </div>
        </div>
            <h1>Welcome to YesOS</h1>
            <p>YesOS is the best OS in the world! (At least in my eyes), you have a cool working clock, as well as a notepad. What more could you want?
                Is this really the best OS? YES. 
            </p>
    </div>

    <div class="window" id="notes" style="display:none;">
        <div class="windowheader" id="notesheader">
            <h1>Notes</h1>
            <div style="cursor: pointer" id="notesclose"></div>
        </div>

        <div class="notes-body">
            <div id="sidebar" class="notes-sidebar"></div>
            <div id="notesContent" class="notes-content"></div>
        </div>
    </div>



    <div class="topbar" id="top">
        <p>YesOS</p>
        <p>The answer is Yes</p>
        <p id="timeElement">Time</p>
    </div>

    <div class="desktopApps">

        <div id="notesopen" style="cursor: pointer;">
            <img src="myrepos.png" alt="Notepad">
        </div>
        <div style="cursor: pointer;" id="welcomeopen">
            <img src="yesos.png" alt="welcomescreen">
        </div>
    </div>

    <script>
        setInterval(function () {
        document.querySelector("#timeElement").innerHTML = new Date().toLocaleString();
        }, 1000);
    </script>

    <script src="script.js"></script>
    
  </body>

</html>
